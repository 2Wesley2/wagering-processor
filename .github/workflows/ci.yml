name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nenhuma permissão por padrão; o job só lê o repositório.
permissions: {}

# Em pull request, um push novo cancela a execução anterior. Na main, cada commit roda até o fim.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Suíte completa (Docker Compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Obter o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Versões do Docker e do Compose
        run: |
          docker version
          docker compose version

      - name: Validar o docker-compose.yml
        run: docker compose config --quiet

      - name: Suíte completa (meta-check estrito)
        run: docker compose run --rm --build tests

      - name: Resumo da execução
        if: always()
        run: docker compose run --rm --no-deps tests bun run test:report

      - name: Remover contêineres e volumes de teste
        if: always()
        run: docker compose --profile test down -v
