events {}

http {
  # DNS interno do Docker; "resolve" evita IP obsoleto após recriar um app.
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream app {
    zone app 64k;
    server app-1:3000 resolve max_fails=1 fail_timeout=5s;
    server app-2:3000 resolve max_fails=1 fail_timeout=5s;
    server app-3:3000 resolve max_fails=1 fail_timeout=5s;
    keepalive 16;
  }

  server {
    listen 80;

    # Métricas só na rede interna.
    location = /metrics {
      return 404;
    }

    location / {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Sem non_idempotent: um POST já enviado nunca é reenviado a outra instância.
      proxy_next_upstream error timeout http_503;
      proxy_connect_timeout 2s;
    }
  }
}
